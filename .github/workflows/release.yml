# .github/workflows/release.yml — builds Windows, Linux and macOS on every
# v* tag and attaches them to a GitHub Release (GDD §4).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -sSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 0755 "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$tdir"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$tdir/"
          godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Unit tests
        run: |
          set -o pipefail
          godot --headless --path . -s tests/test_runner.gd 2>&1 | tee test.log
          ! grep -q "SCRIPT ERROR" test.log

      - name: Export all platforms
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux build/macos
          godot --headless --path . --export-release "Windows Desktop" build/windows/neon-weave.exe
          godot --headless --path . --export-release "Linux" build/linux/neon-weave.x86_64
          godot --headless --path . --export-release "macOS" build/macos/neon-weave.zip
          ls -la build/*

      - name: Smoke test the Linux build (boots to the title and renders a frame)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 >/dev/null
          chmod +x build/linux/neon-weave.x86_64
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
            build/linux/neon-weave.x86_64 --rendering-method gl_compatibility --rendering-driver opengl3 \
              --resolution 1280x720 --audio-driver Dummy -- --screenshot="$PWD/build/smoke-title.png" --title
          test -s build/smoke-title.png

      - name: Upload the smoke screenshot
        uses: actions/upload-artifact@v7
        with:
          name: smoke-title
          path: build/smoke-title.png

      - name: Package
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME}"
          (cd build/windows && zip -qr "../neon-weave-${v}-windows.zip" .)
          (cd build/linux && tar -czf "../neon-weave-${v}-linux.tar.gz" .)
          mv build/macos/neon-weave.zip "build/neon-weave-${v}-macos.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            build/*.zip
            build/*.tar.gz

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            build/*.zip
            build/*.tar.gz

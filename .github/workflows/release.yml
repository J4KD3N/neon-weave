# .github/workflows/release.yml — builds Windows, Linux and macOS on every
# v* tag and attaches them to a GitHub Release (GDD §4).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -sSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 0755 "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$tdir"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$tdir/"
          godot --version

      - name: Import project
        run: godot --headless --path . --import

      # macOS signing and notarization (S59, D-114): only when the five APPLE_*
      # secrets exist. rcodesign does both on Linux; Godot is told where it is,
      # the preset is flipped to rcodesign for this run, and the credentials go
      # in through Godot's GODOT_MACOS_* environment overrides. Without the
      # secrets the export is the ad-hoc build it always was.
      - name: Sign and notarize macOS (when the Apple secrets exist)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RCODESIGN_VERSION: "0.29.0"
        run: |
          set -euo pipefail
          missing=""
          for s in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!s:-}" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "macOS: ad-hoc build (secrets not set:$missing)"
            exit 0
          fi
          echo "macOS: signing and notarizing with rcodesign $RCODESIGN_VERSION"
          curl -sSL -o rcodesign.tar.gz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf rcodesign.tar.gz
          sudo install -m 0755 apple-codesign-*/rcodesign /usr/local/bin/rcodesign
          rcodesign --version
          mkdir -p "$HOME/apple"
          echo "$APPLE_CERTIFICATE_P12" | base64 -d > "$HOME/apple/cert.p12"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$HOME/apple/key.p8"
          rcodesign encode-app-store-connect-api-key -o "$HOME/apple/api-key.json" "$APPLE_API_ISSUER" "$APPLE_API_KEY_ID" "$HOME/apple/key.p8"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/macos/rcodesign = "/usr/local/bin/rcodesign"\n' > "$HOME/.config/godot/editor_settings-4.7.tres"
          sed -i 's|^codesign/codesign=0|codesign/codesign=2|; s|^notarization/notarization=0|notarization/notarization=2|' export_presets.cfg
          {
            echo "GODOT_MACOS_CODESIGN_CERTIFICATE_FILE=$HOME/apple/cert.p12"
            echo "GODOT_MACOS_CODESIGN_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "GODOT_MACOS_NOTARIZATION_API_UUID=$APPLE_API_ISSUER"
            echo "GODOT_MACOS_NOTARIZATION_API_KEY=$HOME/apple/api-key.json"
            echo "GODOT_MACOS_NOTARIZATION_API_KEY_ID=$APPLE_API_KEY_ID"
          } >> "$GITHUB_ENV"


      - name: Unit tests
        run: |
          set -o pipefail
          godot --headless --path . -s tests/test_runner.gd 2>&1 | tee test.log
          ! grep -q "SCRIPT ERROR" test.log

      - name: Export all platforms
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux build/macos
          godot --headless --path . --export-release "Windows Desktop" build/windows/neon-weave.exe
          godot --headless --path . --export-release "Linux" build/linux/neon-weave.x86_64
          godot --headless --path . --export-release "macOS" build/macos/neon-weave.zip
          ls -la build/*

      - name: Verify the macOS signature (when signed)
        run: |
          set -euo pipefail
          if [ -z "${GODOT_MACOS_CODESIGN_CERTIFICATE_FILE:-}" ]; then echo "ad-hoc build: nothing to verify"; exit 0; fi
          mkdir -p build/macos-check && (cd build/macos-check && unzip -qo ../macos/neon-weave.zip)
          app=$(find build/macos-check -maxdepth 1 -name "*.app" | head -n 1)
          rcodesign verify "$app" || true
          rcodesign print-signature-info "$app" | head -n 40

      - name: Smoke test the Linux build (boots to the title and renders a frame)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 >/dev/null
          chmod +x build/linux/neon-weave.x86_64
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
            build/linux/neon-weave.x86_64 --rendering-method gl_compatibility --rendering-driver opengl3 \
              --resolution 1280x720 --audio-driver Dummy -- --screenshot="$PWD/build/smoke-title.png" --title
          test -s build/smoke-title.png

      - name: Upload the smoke screenshot
        uses: actions/upload-artifact@v7
        with:
          name: smoke-title
          path: build/smoke-title.png

      - name: Package
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME}"
          (cd build/windows && zip -qr "../neon-weave-${v}-windows.zip" .)
          (cd build/linux && tar -czf "../neon-weave-${v}-linux.tar.gz" .)
          mv build/macos/neon-weave.zip "build/neon-weave-${v}-macos.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            build/*.zip
            build/*.tar.gz

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            build/*.zip
            build/*.tar.gz

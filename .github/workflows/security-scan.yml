# .github/workflows/security-scan.yml — weekly rescan of main.
# New CVEs appear against old code; this makes checking constant rather than
# commit-time. Tailored: no deployed image, so only the source tree is rescanned.
name: security-scan
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fail on expired .trivyignore entries
        run: |
          [ -f .trivyignore ] || exit 0
          today=$(date +%F); bad=0
          # format:  CVE-2024-1234  # expires 2026-12-31  reason...
          while read -r line; do
            exp=$(echo "$line" | grep -oE 'expires [0-9]{4}-[0-9]{2}-[0-9]{2}' | cut -d' ' -f2 || true)
            [ -n "$exp" ] && [ "$exp" \< "$today" ] && { echo "expired ignore: $line"; bad=1; }
          done < <(grep -v '^\s*#' .trivyignore | grep -v '^\s*$')
          exit $bad

      - name: Scan main (source)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-main.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with: { sarif_file: trivy-main.sarif, category: main-source }

      - name: Count findings and open/update issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          count() { [ -f "$1" ] && python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['runs'][0]['results']))" "$1" || echo 0; }
          M=$(count trivy-main.sarif)
          echo "main=$M"
          [ "$M" -eq 0 ] && exit 0
          TITLE="Security scan: findings on $(date +%F)"
          BODY="Weekly scan found HIGH/CRITICAL vulnerabilities.\n\n- main (source): $M\n\nSee Security → Code scanning alerts. Triage: fix, ignore with expiry in .trivyignore, or track upstream."
          EXISTING=$(gh issue list --label security-scan --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$(printf "$BODY")"
          else gh issue create --title "$TITLE" --label security-scan --body "$(printf "$BODY")"; fi

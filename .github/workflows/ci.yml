# .github/workflows/ci.yml — proves the project on every PR and push to main.
# Job name must stay "ci": branch protection references it.
# Adapted from the dev-workflow standard for a Godot project: no package
# manager, so Trivy scans the tree for secrets/misconfig and the SBOM is
# generated from source.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload Trivy SARIF to the Security tab

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 0755 "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version

      # First headless run imports resources (icon, scenes) and generates .uid files.
      - name: Import project
        run: godot --headless --path . --import

      # A runtime script error aborts a test method without a recorded
      # failure, so the log is also checked for SCRIPT ERROR.
      - name: Unit tests
        run: |
          set -o pipefail
          godot --headless --path . -s tests/test_runner.gd 2>&1 | tee test.log
          ! grep -q "SCRIPT ERROR" test.log

      # --- security: nothing to resolve, so scan the source tree ---
      - name: Trivy scan (secrets, misconfig; fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret,misconfig
      - name: Upload scan results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: trivy.sarif }
      - name: Keep SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: trivy-sarif, path: trivy.sarif }

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: sbom.spdx.json }

  # Renders the exploration scene under Xvfb with Mesa's software GL and
  # uploads a screenshot. Best-effort: not a required check, but the only
  # eyes on the map until someone opens the editor.
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot ${{ env.GODOT_VERSION }} and a software GL stack
        run: |
          set -euo pipefail
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 0755 "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6

      - name: Import project
        run: godot --headless --path . --import

      - name: Render screenshot
        run: |
          set -euo pipefail
          mkdir -p build
          run_shot() {
            timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
              godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 \
                --resolution 1280x720 --audio-driver Dummy -- "$@"
          }
          run_shot --screenshot="$PWD/build/screenshot.png"
          run_shot --screenshot="$PWD/build/screenshot-title.png" --title
          run_shot --screenshot="$PWD/build/screenshot-combat.png" --map=proto_yard --screenshot-combat
          run_shot --screenshot="$PWD/build/screenshot-shard.png" --shard=7
          run_shot --screenshot="$PWD/build/screenshot-datacore.png" --shard=7 --biome=verdant_datacore
          run_shot --screenshot="$PWD/build/screenshot-markets.png" --shard=7 --biome=ghost_markets
          run_shot --screenshot="$PWD/build/screenshot-cathedral.png" --shard=7 --biome=null_cathedral
          run_shot --screenshot="$PWD/build/screenshot-loom.png" --shard=7 --biome=loom_approach
          run_shot --screenshot="$PWD/build/screenshot-creator.png" --creator
          run_shot --screenshot="$PWD/build/screenshot-dialogue.png" --map=proto_yard --talk=sera
          run_shot --screenshot="$PWD/build/screenshot-road.png" --map=gate_road --journal
          ls -la build

      - uses: actions/upload-artifact@v7
        with:
          name: screenshot
          path: build/screenshot*.png
